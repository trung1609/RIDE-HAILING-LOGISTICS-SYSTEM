global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: discovery-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["discovery-service:8761"]

  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["booking-service:8083"]

  - job_name: location-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["location-service:8082"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8085"]

  - job_name: pricing-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["pricing-service:8084"]

  - job_name: user-driver-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-driver-service:8081"]

  - job_name: 'vps-hardware'
    scrape_interval: 10s
    static_configs:
      - targets: [ 'node-exporter:9100' ]

