name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build file .jar từng service con
        run: |
          cd discovery-service && ./gradlew clean bootJar -x test --no-daemon && cd ..
          cd api-gateway && ./gradlew clean bootJar -x test --no-daemon && cd ..
          cd user-driver-service && ./gradlew clean bootJar -x test --no-daemon && cd ..
          cd payment-service && ./gradlew clean bootJar -x test --no-daemon && cd ..
          cd booking-service && ./gradlew clean bootJar -x test --no-daemon && cd ..
          cd pricing-service && ./gradlew clean bootJar -x test --no-daemon && cd ..
          cd location-service && ./gradlew clean bootJar -x test --no-daemon && cd ..

      - name: Build file .jar (Bỏ qua test)
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build và Push Docker Images lên Docker Hub
        run: |
          # 1. Discovery Service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/discovery-service:latest ./discovery-service
          docker push ${{ secrets.DOCKER_USERNAME }}/discovery-service:latest
          
          # 2. API Gateway
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest ./api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

          # 3. User Driver Service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-driver-service:latest ./user-driver-service
          docker push ${{ secrets.DOCKER_USERNAME }}/user-driver-service:latest
          
          # 4. Payment Service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/payment-service:latest ./payment-service
          docker push ${{ secrets.DOCKER_USERNAME }}/payment-service:latest
          
          # 5. Booking Service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/booking-service:latest ./booking-service
          docker push ${{ secrets.DOCKER_USERNAME }}/booking-service:latest

          # 6. Pricing Service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/pricing-service:latest ./pricing-service
          docker push ${{ secrets.DOCKER_USERNAME }}/pricing-service:latest

          # 7. Location Service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/location-service:latest ./location-service
          docker push ${{ secrets.DOCKER_USERNAME }}/location-service:latest

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /home/trung/RIDE-HAILING-LOGISTICS-SYSTEM
            
            # Pull toàn bộ image mới nhất từ Docker Hub về VPS
            docker compose pull
            
            # Khởi động lại các container với image mới (không cần build lại)
            docker compose up -d
            
            # Dọn dẹp rác (image cũ) để giải phóng RAM/Ổ cứng VPS
            docker image prune -f