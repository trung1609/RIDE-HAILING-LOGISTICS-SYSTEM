name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho TẤT CẢ gradlew
        run: find . -name "gradlew" -exec chmod +x {} \;

      - name: Build file .jar từng service con
        run: |
          (cd discovery-service && ./gradlew clean bootJar -x test --no-daemon)
          (cd api-gateway && ./gradlew clean bootJar -x test --no-daemon)
          (cd user-driver-service && ./gradlew clean bootJar -x test --no-daemon)
          (cd payment-service && ./gradlew clean bootJar -x test --no-daemon)
          (cd booking-service && ./gradlew clean bootJar -x test --no-daemon)
          (cd pricing-service && ./gradlew clean bootJar -x test --no-daemon)
          (cd location-service && ./gradlew clean bootJar -x test --no-daemon)

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build và Push Docker Images lên Docker Hub
        run: |
          # 1. Discovery Service
          docker build -t vmt1609/discovery-service:latest ./discovery-service
          docker push vmt1609/discovery-service:latest
          
          # 2. API Gateway
          docker build -t vmt1609/api-gateway:latest ./api-gateway
          docker push vmt1609/api-gateway:latest

          # 3. User Driver Service
          docker build -t vmt1609/user-driver-service:latest ./user-driver-service
          docker push vmt1609/user-driver-service:latest
          
          # 4. Payment Service
          docker build -t vmt1609/payment-service:latest ./payment-service
          docker push vmt1609/payment-service:latest
          
          # 5. Booking Service
          docker build -t vmt1609/booking-service:latest ./booking-service
          docker push vmt1609/booking-service:latest

          # 6. Pricing Service
          docker build -t vmt1609/pricing-service:latest ./pricing-service
          docker push vmt1609/pricing-service:latest

          # 7. Location Service
          docker build -t vmt1609/location-service:latest ./location-service
          docker push vmt1609/location-service:latest

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /home/trung/RIDE-HAILING-LOGISTICS-SYSTEM
            
            git pull origin main
            
            docker compose pull
            
            docker compose up -d
            
            docker image prune -f