<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix ride-hailing
  include_tag_key true
  tag_key @log_name
  reconnect_on_error true
  reload_connections true
  request_timeout 30s
  <buffer>
    @type file
    path /fluentd/logs/buffer
    flush_interval 5s
    retry_forever true
  </buffer>
</match>

