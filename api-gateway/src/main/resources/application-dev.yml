server:
  port: 8080

spring:
  data:
    redis:
      port: 6379
      host: localhost
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-driver-route
              uri: lb://user-driver-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/drivers/**
            - id: location-service-route
              uri: lb://location-service
              predicates:
                - Path=/api/v1/locations/**
            - id: location-websocket-route
              uri: lb:ws://location-service
              predicates:
                - Path=/ws-location/**
            - id: booking-service-route
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**
            - id: booking-websocket-route
              uri: lb:ws://booking-service
              predicates:
                - Path=/ws-booking/**
            - id: pricing-service-route
              uri: lb://pricing-service
              predicates:
                - Path=/api/v1/pricing/**
            - id: payment-service-route
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: DayLaChuoiBiMatMacDinhCuaToiChoMoiTruongDev123456

logging:
  level:
    root: INFO
    com.trung: DEBUG

    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

    org.springframework: INFO
    org.apache.kafka: INFO