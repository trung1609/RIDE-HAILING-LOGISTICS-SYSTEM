<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khách Hàng Đặt Xe Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .map-container {
            position: relative;
        }

        #map {
            height: 450px;
            width: 100%;
            margin-top: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .stats-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            border: 2px solid #007bff;
            width: 220px;
        }

        .stats-panel h4 {
            margin: 0 0 10px 0;
            color: #007bff;
            text-align: center;
        }

        #log {
            color: darkcyan;
            margin-top: 20px;
            height: 150px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
            list-style-type: none;
        }

        .radar-pulse {
            width: 30px;
            height: 30px;
            background-color: rgba(0, 123, 255, 0.5);
            border-radius: 50%;
            animation: pulse 1s infinite ease-out;
            border: 2px solid #007bff;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        .nearby-car-icon {
            transition: transform 2s linear !important;
        }

        .momo-btn {
            background-color: #a50064;
            color: white;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: none;
            border-radius: 5px;
            margin-left: 10px;
        }

        /* ⚡ Header User Style */
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 5px solid #007bff;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="user-header">
    <span>👋 Xin chào Khách hàng: <b id="display-user" style="color:#007bff;">Đang tải...</b></span>
    <button class="logout-btn" onclick="logout()">Đăng Xuất</button>
</div>

<h2>Ứng dụng Khách Hàng (Mô phỏng Giá Động)</h2>

<button id="btnConnect" onclick="connectNotification()">1. Kết nối hệ thống</button>
<button id="btnBook" onclick="bookRide()" disabled
        style="background-color: #28a745; color: white; padding: 8px 15px; font-weight: bold; border: none; cursor: pointer;">
    2. 🚕 ĐẶT XE NGAY
</button>

<button id="btnHistory" onclick="toggleBookingHistory()"
        style="background-color: #17a2b8; color: white; padding: 8px 15px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; margin-left: 10px;">
    3. 📜 Lịch sử chuyến đi
</button>

<div id="status" style="margin-top: 15px; font-weight: bold; color: gray;">Trạng thái: Chưa kết nối</div>

<div id="history-panel"
     style="display: none; margin-top: 15px; background: #fff; border: 2px solid #17a2b8; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h3 style="color: #17a2b8; margin-top: 0; display: flex; justify-content: space-between;">
        <span>📜 LỊCH SỬ CHUYẾN ĐI CỦA BẠN</span>
        <button onclick="toggleBookingHistory()"
                style="background: none; border: none; font-size: 16px; cursor: pointer; color: red;">❌ Đóng
        </button>
    </h3>
    <button onclick="fetchBookingHistory()" style="margin-bottom: 10px; cursor:pointer; padding: 5px 10px;">🔄 Làm mới dữ
        liệu
    </button>
    <ul id="booking-history-list"
        style="list-style-type: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto;">
    </ul>
</div>

<div class="map-container">
    <div id="map"></div>
    <div class="stats-panel" id="stats-panel" style="display: none;">
        <h4>📊 Radar Khu vực</h4>
        <p style="margin: 5px 0; font-weight: bold;">🚕 Cung (Tài xế rảnh): <span id="supply-count"
                                                                                 style="color: green; font-size: 18px;">0</span>
        </p>
        <p style="margin: 5px 0; font-weight: bold;">📈 Mức giá hiện tại: <br><span id="surge-badge"
                                                                                   style="color: blue; font-size: 14px; background: #e9ecef; padding: 3px 6px; border-radius: 4px;">Đang tính toán...</span>
        </p>
    </div>
</div>

<div id="trip-card"
     style="margin-top: 20px; padding: 15px; background-color: #e2f0d9; border: 1px solid #c8e1b7; display: none; border-radius: 8px;">
    <h3 style="color: #385723; margin-top: 0;">🚗 TRẠNG THÁI CHUYẾN ĐI</h3>
    <p style="font-size: 16px; font-weight: bold; color: #274e13;">
        <span id="trip-status-text"></span>
        <span id="customer-timer" style="color: red; margin-left: 10px; display: none;"></span>
    </p>
    <button id="btnCancelTrip" onclick="cancelCurrentTrip(false)"
            style="background-color: #dc3545; color: white; padding: 8px 15px; border: none; cursor: pointer; font-weight: bold; display: none; border-radius: 5px;">
        HỦY CHUYẾN ĐI
    </button>
    <button id="btnPayMomo" class="momo-btn" onclick="payTrip('MOMO')">Thanh toán MoMo</button>
    <button id="btnPayVnpay" class="momo-btn" onclick="payTrip('VNPAY')" style="background-color: #005691;">Thanh toán
        VNPay
    </button>
</div>

<h3>Nhật ký hệ thống:</h3>
<ul id="log"></ul>

<script>
    const isLocal = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
    const API_BASE_URL = isLocal ? 'http://localhost:8080' : 'https://api.ridehailingsystem.online';
    const WS_BASE_URL = isLocal ? 'http://localhost:8080' : 'https://api.ridehailingsystem.online';

    let stompClient = null;
    let customerId = null;
    let currentBookingId = null;
    let currentTripPrice = 0;
    let assignedDriverId = null;
    let activeDriverId = null;
    let customerTimerInterval = null;
    let nearbyDriversInterval = null;
    let map = null;
    let radarMarker = null;
    let isClientCanceling = false;
    let hasInitiatedPayment = false;
    let driverMarkers = {};
    let paymentCheckInterval = null;

    const startPoint = [21.0245, 105.8574];
    const endPoint = [21.0585, 105.8202];
    const nearbyCarIcon = L.divIcon({
        className: 'nearby-car-icon',
        html: `<div style="width: 30px; height: 15px;"><svg width="30" height="15" viewBox="0 0 100 50" version="1.1" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="100" height="50" rx="10" ry="10" style="fill:#FDD835;stroke:black;stroke-width:2" /><rect x="70" y="5" width="25" height="40" style="fill:#0D47A1;" /><text x="50" y="32" font-family="Arial" font-size="20" font-weight="bold" fill="black" text-anchor="middle">TAXI</text></svg></div>`,
        iconSize: [30, 15],
        iconAnchor: [15, 7]
    });

    async function doRefreshToken() {
        try {
            let res = await fetch(`${API_BASE_URL}/api/v1/auth/refresh`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + getStoredToken()
                },
                credentials: 'include'
            });

            if (!res.ok) return false;

            let data = await res.json();
            if (data.success && data.data.accessToken) {
                localStorage.setItem('accessToken', data.data.accessToken);
                return true;
            }
            return false;
        } catch (e) {
            return false;
        }
    }

    async function fetchWithAuth(url, options = {}) {
        if (!options.headers) options.headers = {};
        options.headers['Authorization'] = 'Bearer ' + getStoredToken();
        options.credentials = 'include';

        let response = await fetch(url, options);

        if (response.status === 401) {
            console.warn("Access Token hết hạn! Đang tiến hành refresh ngầm...");
            const isRefreshed = await doRefreshToken();

            if (isRefreshed) {
                options.headers['Authorization'] = 'Bearer ' + getStoredToken();
                response = await fetch(url, options);
            } else {
                doActualLogout(getStoredToken());
                throw new Error("Phiên đăng nhập đã hết hạn hoàn toàn. Vui lòng đăng nhập lại!");
            }
        }
        return response;
    }

    function getStoredToken() {
        const token = localStorage.getItem('accessToken');
        if (!token) {
            window.location.href = 'index.html';
            return null;
        }
        return token;
    }

    function parseJwt(token) {
        try {
            let base64Url = token.split('.')[1];
            return JSON.parse(decodeURIComponent(window.atob(base64Url.replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        } catch (e) {
            return null;
        }
    }

    function logout() {
        const token = getStoredToken();
        if (!token) return;
        doActualLogout(token);
    }

    function doActualLogout(token) {
        fetch(`${API_BASE_URL}/api/v1/auth/logout`, {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + token},
            credentials: 'include'
        }).finally(() => {
            localStorage.removeItem('accessToken');
            window.location.href = 'index.html';
        });
    }

    window.onload = function () {
        let t = getStoredToken();
        if (!t) return;

        let decoded = parseJwt(t);
        if (decoded) {
            customerId = decoded.userId || decoded.id;
            document.getElementById('display-user').innerText = decoded.sub + ' (ID: ' + customerId + ')';
        }

        map = L.map('map').setView([21.0415, 105.8388], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OpenStreetMap'}).addTo(map);
        L.marker(startPoint).addTo(map).bindPopup("<b>Điểm đón</b>").openPopup();
        const redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34]
        });
        L.marker(endPoint, {icon: redIcon}).addTo(map).bindPopup("<b>Điểm đến</b>");
        L.polyline([startPoint, endPoint], {color: '#007bff', weight: 4, dashArray: '10, 10'}).addTo(map);

        connectNotification();
    };

    function startCustomerTimer() {
        clearInterval(customerTimerInterval);
        let timerEl = document.getElementById('customer-timer');
        timerEl.style.display = "inline";
        timerEl.innerText = `(⏳ Đang chờ tài xế...)`;

        let dots = 0;
        customerTimerInterval = setInterval(() => {
            dots = (dots + 1) % 4;
            let dotStr = ".".repeat(dots);
            timerEl.innerText = `(🔄 Đang quét tìm tài xế phù hợp${dotStr})`;
        }, 1000);
    }

    function loadNearbyDrivers() {
        let cleanToken = getStoredToken();
        if (!cleanToken) return;
        let url = `${API_BASE_URL}/api/v1/locations/nearby?longitude=${startPoint[1]}&latitude=${startPoint[0]}&radius=5.0`;

        fetchWithAuth(url, {method: 'GET'})
            .then(async res => {
                if (!res.ok) throw new Error("HTTP Status: " + res.status);
                let responseText = await res.text();
                return responseText ? JSON.parse(responseText) : [];
            })
            .then(data => {
                if (!Array.isArray(data)) return;
                let currentDriverIds = [];

                data.forEach(driver => {
                    let idStr = driver.driverId.toString();
                    currentDriverIds.push(idStr);
                    let latlng = [driver.latitude, driver.longitude];
                    if (activeDriverId && idStr === activeDriverId.toString()) return;
                    if (driverMarkers[idStr]) {
                        driverMarkers[idStr].setLatLng(latlng);
                    } else {
                        driverMarkers[idStr] = L.marker(latlng, {icon: nearbyCarIcon}).addTo(map).bindPopup(`🚕 Tài xế ID: ${idStr}`);
                    }
                });

                for (let id in driverMarkers) {
                    if (activeDriverId && id === activeDriverId.toString()) continue;
                    if (!currentDriverIds.includes(id)) {
                        map.removeLayer(driverMarkers[id]);
                        delete driverMarkers[id];
                    }
                }
                document.getElementById('supply-count').innerText = Object.keys(driverMarkers).length;
            })
            .catch(err => console.warn("Lỗi quét tài xế:", err.message));
    }

    function startRadar() {
        if (radarMarker) map.removeLayer(radarMarker);
        let radarIcon = L.divIcon({
            className: '',
            html: '<div class="radar-pulse"></div>',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });
        radarMarker = L.marker(startPoint, {icon: radarIcon}).addTo(map);
    }

    function stopRadar() {
        if (radarMarker) {
            map.removeLayer(radarMarker);
            radarMarker = null;
        }
    }

    function updateSurgeBadgeByPrice(price) {
        let badge = document.getElementById('surge-badge');
        if (price > 120000) {
            badge.innerText = `🔥 TĂNG GIÁ (Cầu cao)`;
            badge.style.color = "red";
            badge.style.fontWeight = "bold";
        } else {
            badge.innerText = `Bình thường (1.0x)`;
            badge.style.color = "green";
            badge.style.fontWeight = "normal";
        }
    }

    function cleanupSystem() {
        clearInterval(nearbyDriversInterval);
        clearInterval(customerTimerInterval);
        if (stompClient) stompClient.disconnect();
        document.getElementById('status').innerText = "Trạng thái: TOKEN HẾT HẠN";
        document.getElementById('status').style.color = "red";
        document.getElementById('btnBook').disabled = true;
        document.getElementById('btnConnect').disabled = false;
    }

    function logSystem(bookingId, status, messageStr) {
        let logEl = document.getElementById('log');
        let color = status === 'COMPLETED' ? "green" : (status === 'CANCELLED' || status === 'TIMEOUT' ? "red" : "blue");
        logEl.innerHTML += `<li style="font-weight:bold; color:${color}">[ID: ${bookingId || '?'}] -> ${status}: ${messageStr}</li>`;
        logEl.scrollTop = logEl.scrollHeight;
    }

    function connectNotification() {
        let cleanToken = getStoredToken();
        if (!cleanToken) return;

        let socket = new SockJS(`${WS_BASE_URL}/ws-booking`);
        stompClient = Stomp.over(socket);

        stompClient.connect({
            "userId": customerId.toString(),
            "role": "CUSTOMER"
        }, function (frame) {
            document.getElementById('status').innerText = `Đã kết nối (ID: ${customerId})`;
            document.getElementById('status').style.color = "green";
            document.getElementById('btnBook').disabled = false;
            document.getElementById('btnConnect').disabled = true;
            document.getElementById('stats-panel').style.display = "block";

            if (nearbyDriversInterval) clearInterval(nearbyDriversInterval);
            loadNearbyDrivers();
            nearbyDriversInterval = setInterval(loadNearbyDrivers, 3500);

            stompClient.subscribe('/user/queue/booking/status', function (message) {
                let bookingInfo = JSON.parse(message.body);

                if (bookingInfo.status === 'PENDING' || bookingInfo.status === 'ACCEPTED') {
                    document.getElementById('btnCancelTrip').style.display = "inline-block";
                } else {
                    document.getElementById('btnCancelTrip').style.display = "none";
                }

                if (bookingInfo.status === 'PENDING') {
                    document.getElementById('btnPayMomo').style.display = "none";
                    document.getElementById('btnPayVnpay').style.display = "none";

                    hasInitiatedPayment = false;
                    let oldBadge = document.getElementById('paid-badge');
                    if (oldBadge) oldBadge.remove();

                    startRadar();
                    startCustomerTimer();

                    if (activeDriverId && driverMarkers[activeDriverId.toString()]) {
                        map.removeLayer(driverMarkers[activeDriverId.toString()]);
                        delete driverMarkers[activeDriverId.toString()];
                    }
                    activeDriverId = null;
                    if (bookingInfo.price) updateSurgeBadgeByPrice(bookingInfo.price);
                } else {
                    clearInterval(customerTimerInterval);
                    document.getElementById('customer-timer').style.display = "none";
                    stopRadar();

                    if ((bookingInfo.status === 'ACCEPTED' || bookingInfo.status === 'COMPLETED') && !hasInitiatedPayment) {
                        document.getElementById('btnPayMomo').style.display = "inline-block";
                        document.getElementById('btnPayVnpay').style.display = "inline-block";
                    } else {
                        document.getElementById('btnPayMomo').style.display = "none";
                        document.getElementById('btnPayVnpay').style.display = "none";
                    }
                }

                if (bookingInfo.status === 'CANCELLED') {
                    if (!isClientCanceling) {
                        logSystem(bookingInfo.bookingId, "CANCELLED", "Hệ thống hủy chuyến đi (Không tìm thấy tài xế).");
                        alert("❌ THÔNG BÁO: Hệ thống không tìm thấy tài xế rảnh nào tiếp nhận. Cuốc xe đã hủy.");
                    } else {
                        logSystem(bookingInfo.bookingId, "CANCELLED", "Bạn đã chủ động hủy chuyến đi.");
                    }

                    if (activeDriverId && driverMarkers[activeDriverId.toString()]) {
                        map.removeLayer(driverMarkers[activeDriverId.toString()]);
                        delete driverMarkers[activeDriverId.toString()];
                    }
                    activeDriverId = null;
                    currentBookingId = null;
                    document.getElementById('trip-card').style.display = "none";
                    document.getElementById('btnPayMomo').style.display = "none";
                    document.getElementById('btnPayVnpay').style.display = "none";
                    stopRadar();
                    document.getElementById('surge-badge').innerText = "Trở về bình thường";
                    document.getElementById('surge-badge').style.color = "blue";
                    isClientCanceling = false;
                    return;
                }

                currentBookingId = bookingInfo.bookingId;
                document.getElementById('trip-card').style.display = "block";
                document.getElementById('trip-status-text').innerText = `Mã chuyến: #${bookingInfo.bookingId} | Trạng thái: ${bookingInfo.status} | Tài xế ID: ${bookingInfo.driverId || 'Đang tìm tài xế...'}`;

                if (bookingInfo.status === 'ACCEPTED' && bookingInfo.driverId) {
                    activeDriverId = bookingInfo.driverId;
                    assignedDriverId = bookingInfo.driverId;
                    let idStr = activeDriverId.toString();
                    if (driverMarkers[idStr]) driverMarkers[idStr].setLatLng(startPoint);
                    else driverMarkers[idStr] = L.marker(startPoint, {icon: nearbyCarIcon}).addTo(map).bindPopup(`🚕 Tài xế Mới Đón Bạn (ID: ${idStr})`);
                    driverMarkers[idStr].openPopup();
                }

                if (bookingInfo.status === 'COMPLETED') {
                    if (activeDriverId && driverMarkers[activeDriverId.toString()]) {
                        map.removeLayer(driverMarkers[activeDriverId.toString()]);
                        delete driverMarkers[activeDriverId.toString()];
                    }
                    activeDriverId = null;
                    document.getElementById('surge-badge').innerText = "Trở về bình thường";
                    document.getElementById('surge-badge').style.color = "blue";
                }

                logSystem(bookingInfo.bookingId, bookingInfo.status, "Cập nhật từ hệ thống");
                if (bookingInfo.status === 'COMPLETED') alert("Tài xế đã hoàn thành chuyến đi! Bạn có thể thanh toán ngay.");
            });
        }, function (error) {
            console.error('Lỗi kết nối STOMP: ' + error);
            document.getElementById('status').innerText = "Trạng thái: KẾT NỐI THẤT BẠI";
            document.getElementById('status').style.color = "red";
        });
    }

    function bookRide() {
        let cleanToken = getStoredToken();
        if (!cleanToken) return;
        let payload = {
            "startLongitude": startPoint[1],
            "startLatitude": startPoint[0],
            "endLongitude": endPoint[1],
            "endLatitude": endPoint[0]
        };

        fetchWithAuth(`${API_BASE_URL}/api/v1/bookings`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(async res => {
            if (!res.ok) {
                let err = await res.json().catch(() => ({}));
                throw new Error(err.message || "Lỗi hệ thống");
            }
            return res.json();
        }).then(data => {
            if (data.status === 'CANCELLED') {
                alert("❌ ĐẶT XE THẤT BẠI: Hết xe rảnh!");
                return;
            }

            currentBookingId = data.bookingId;
            currentTripPrice = data.price;
            hasInitiatedPayment = false;
            let oldBadge = document.getElementById('paid-badge');
            if (oldBadge) oldBadge.remove();

            updateSurgeBadgeByPrice(data.price);
            document.getElementById('trip-card').style.display = "block";
            document.getElementById('btnPayMomo').style.display = "none";
            document.getElementById('trip-status-text').innerText = `Mã chuyến: #${data.bookingId} | Đang chờ...`;
            document.getElementById('btnCancelTrip').style.display = "inline-block";

            startRadar();
            startCustomerTimer();
            logSystem(data.bookingId, "PENDING", `Đã gửi yêu cầu đặt xe. Thành tiền: ${Math.round(data.price).toLocaleString('vi-VN')} VND`);
        }).catch(err => alert("⚠️ ĐẶT XE THẤT BẠI: " + err.message));
    }

    function cancelCurrentTrip(isAutomaticTimeout = false) {
        if (!currentBookingId) return;
        if (!isAutomaticTimeout && !confirm("Bạn có chắc chắn muốn hủy?")) return;

        let cleanToken = getStoredToken();
        if (!cleanToken) return;
        isClientCanceling = true;

        fetchWithAuth(`${API_BASE_URL}/api/v1/bookings/${currentBookingId}/cancel`, {
            method: 'PUT',
            headers: {'X-User-Id': customerId.toString()}
        }).then(async res => {
            if (!res.ok) throw new Error("Không thể hủy!");
            return res.json();
        }).then(data => {
            document.getElementById('btnCancelTrip').style.display = "none";
            document.getElementById('btnPayMomo').style.display = "none";
            clearInterval(customerTimerInterval);
            document.getElementById('customer-timer').style.display = "none";
            stopRadar();
            document.getElementById('trip-card').style.display = "none";
            document.getElementById('surge-badge').innerText = "Trở về bình thường";
            document.getElementById('surge-badge').style.color = "blue";
            if (isAutomaticTimeout) alert("❌ HỆ THỐNG TIMEOUT: Không tìm thấy phản hồi từ tài xế, cuốc xe tự động hủy!");
            else alert("Đã hủy chuyến thành công!");
        }).catch(err => {
            isAutomaticTimeout = false;
            document.getElementById('btnCancelTrip').style.display = "none";
            clearInterval(customerTimerInterval);
            document.getElementById('customer-timer').style.display = "none";
            stopRadar();
            document.getElementById('trip-card').style.display = "none";
        });
    }

    function payTrip(method) {
        if (!currentBookingId || !currentTripPrice || !assignedDriverId) {
            alert("Thông tin cuốc xe không hợp lệ!");
            return;
        }
        let cleanToken = getStoredToken();
        if (!cleanToken) return;

        fetchWithAuth(`${API_BASE_URL}/api/v1/payments/payment/create?method=${method}&type=TRIP&bookingId=${currentBookingId}&driverId=${assignedDriverId}&amount=${currentTripPrice}`, {
            method: 'POST', headers: {'X-User-Id': customerId.toString()}
        }).then(async res => {
            if (!res.ok) throw new Error("Lỗi gọi cổng thanh toán");
            return res.json();
        }).then(data => {
            if (data.paymentUrl) {
                window.open(data.paymentUrl, '_blank');
                hasInitiatedPayment = true;
                document.getElementById('btnPayMomo').style.display = "none";
                document.getElementById('btnPayVnpay').style.display = "none";

                let tripCard = document.getElementById('trip-card');
                let paidBadge = document.createElement("span");
                paidBadge.id = "paid-badge";
                paidBadge.style.cssText = "color: #ed6c02; font-weight: bold; margin-left: 10px; background: #fff3cd; padding: 5px 10px; border-radius: 5px;";
                paidBadge.innerText = `⏳ Đang chờ kết quả từ ${method}...`;

                let cancelPayBtn = document.createElement("button");
                cancelPayBtn.id = "cancel-pay-btn";
                cancelPayBtn.innerText = "❌ Đổi phương thức";
                cancelPayBtn.style.cssText = "margin-left: 10px; background: none; border: 1px solid #dc3545; color: #dc3545; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 13px;";

                cancelPayBtn.onclick = function () {
                    clearInterval(paymentCheckInterval);
                    hasInitiatedPayment = false;
                    paidBadge.remove();
                    cancelPayBtn.remove();

                    fetchWithAuth(`${API_BASE_URL}/api/v1/payments/booking/${currentBookingId}/cancel-pending`, {
                        method: 'PUT'
                    }).catch(err => console.warn("Lỗi hủy PENDING:", err));

                    document.getElementById('btnPayMomo').style.display = "inline-block";
                    document.getElementById('btnPayVnpay').style.display = "inline-block";
                    logSystem(currentBookingId, "INFO", "Khách hàng đã hủy giao dịch cũ để chọn lại phương thức thanh toán.");
                };

                if (!document.getElementById('paid-badge')) {
                    tripCard.appendChild(paidBadge);
                    tripCard.appendChild(cancelPayBtn);
                }
                logSystem(currentBookingId, "PAYMENT", `Bắt đầu gọi cổng ${method} số tiền ${currentTripPrice.toLocaleString('vi-VN')} đ`);

                clearInterval(paymentCheckInterval);
                paymentCheckInterval = setInterval(() => {
                    fetchWithAuth(`${API_BASE_URL}/api/v1/payments/booking/${currentBookingId}/payment-status`)
                        .then(res => res.text())
                        .then(status => {
                            if (status === 'SUCCESS') {
                                clearInterval(paymentCheckInterval);
                                let badge = document.getElementById('paid-badge');
                                let cancelBtn = document.getElementById('cancel-pay-btn');
                                if (badge) badge.remove();
                                if (cancelBtn) cancelBtn.remove();
                                logSystem(currentBookingId, "COMPLETED", `Khách hàng ID ${customerId} đã thanh toán thành công cuốc xe #${currentBookingId} giá ${currentTripPrice.toLocaleString('vi-VN')} đ qua ${method}.`);
                            } else if (status === 'CANCELED' || status === 'FAILED') {
                                clearInterval(paymentCheckInterval);
                                let badge = document.getElementById('paid-badge');
                                if (badge) badge.innerText = "❌ Giao dịch đã bị hủy!";
                            }
                        });
                }, 3000);
            }
        }).catch(err => alert("Lỗi: " + err.message));
    }

    function toggleBookingHistory() {
        let panel = document.getElementById('history-panel');
        if (panel.style.display === 'none') {
            panel.style.display = 'block';
            fetchBookingHistory();
        } else {
            panel.style.display = 'none';
        }
    }

    function fetchBookingHistory() {
        let listEl = document.getElementById('booking-history-list');
        listEl.innerHTML = "<li style='padding: 10px; color: gray;'>⏳ Đang tải dữ liệu...</li>";

        let cleanToken = getStoredToken();
        if (!cleanToken || !customerId) return;


        fetchWithAuth(`${API_BASE_URL}/api/v1/bookings/customer`, {
            method: 'GET',
            headers: {'X-User-Id': customerId.toString()}
        })
            .then(async res => {
                if (!res.ok) throw new Error("Không thể lấy dữ liệu lịch sử");
                return res.json();
            })
            .then(data => {
                listEl.innerHTML = "";
                let bookings = data.data || data;

                if (!Array.isArray(bookings) || bookings.length === 0) {
                    listEl.innerHTML = "<li style='padding: 10px; color: #555; font-style: italic;'>Bạn chưa có chuyến đi nào.</li>";
                    return;
                }

                bookings.reverse().forEach(b => {
                    let statusColor = b.status === 'COMPLETED' ? 'green' : (b.status === 'CANCELLED' ? 'red' : '#ed6c02');
                    let displayPrice = b.price ? b.price.toLocaleString('vi-VN') : 0;
                    let displayId = b.id || b.bookingId;
                    let dateStr = b.createdAt ? new Date(b.createdAt).toLocaleString('vi-VN') : 'Không rõ thời gian';

                    listEl.innerHTML += `
                    <li style="border-bottom: 1px solid #eee; padding: 12px 0; line-height: 1.6;">
                        <div style="font-weight: bold; color: #333; font-size: 15px;">Mã chuyến xe: #${displayId}</div>
                        <div style="font-size: 14px;">Quãng đường: <b>${b.distanceInKm ? b.distanceInKm.toFixed(2) : '?'} km</b> - Thành tiền: <b style="color: #d32f2f;">${displayPrice} đ</b></div>
                        <div style="font-size: 14px;">Trạng thái: <span style="color: ${statusColor}; font-weight: bold;">${b.status}</span></div>
                        <div style="font-size: 12px; color: gray; margin-top: 4px;">📅 Đặt lúc: ${dateStr}</div>
                    </li>
                `;
                });
            })
            .catch(err => {
                listEl.innerHTML = `<li style='padding: 10px; color: red;'>❌ Lỗi: ${err.message}</li>`;
            });
    }
</script>
</body>
</html>
