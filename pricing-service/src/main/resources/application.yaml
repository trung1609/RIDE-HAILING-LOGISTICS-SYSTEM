spring:
  application:
    name: pricing-service
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
server:
  port: 8084

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
