server:
  port: 8083

spring:
  application:
    name: booking-service

  data:
    redis:
      host: localhost
      port: 6379
      database: 2

  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true