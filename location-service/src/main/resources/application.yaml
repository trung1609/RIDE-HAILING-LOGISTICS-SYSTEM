server:
  port: 8082

spring:
  application:
    name: location-service

  data:
    redis:
      host: localhost
      port: 6379
      database: 1

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true